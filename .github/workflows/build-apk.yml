name: Build APK

# Manual only (Actions -> Build APK -> Run workflow); replaces the previous release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
      actions: write    # delete old artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a temporary debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/release/app-release.apk MuteAdTube.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Replace old release
        run: |
          gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" MuteAdTube.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "MuteAd Tube (build ${{ github.run_number }})" \
            --notes "Latest APK from commit ${GITHUB_SHA::7}."

      - name: Delete old workflow artifacts
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate -q '.artifacts[].id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
