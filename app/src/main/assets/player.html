<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden;
               font-family: Roboto, "Segoe UI", sans-serif; color: #fff; }
  .fill { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }

  /* The YouTube iframe is made bigger than the screen and cropped, so YouTube's logo,
     title bar and corner badges sit outside the visible area. It never gets any touch. */
  #stage { overflow: hidden; pointer-events: none; }
  #yt-box { position: absolute; transform-origin: 0 0; pointer-events: none; }
  #yt-box iframe { width: 100%; height: 100%; border: 0; pointer-events: none; display: block; }

  #cover { z-index: 5; background: #000; opacity: 1; transition: opacity .25s; pointer-events: none; }
  #cover.paused { opacity: .6; }
  #cover.hidden { opacity: 0; }
  #shield { z-index: 10; touch-action: none; }

  /* ---------- Controls ---------- */
  #ui { z-index: 20; pointer-events: none; transition: opacity .2s; }
  #ui.off { opacity: 0; }
  #ui.off * { pointer-events: none !important; }
  .grad-top, .grad-bot { position: absolute; left: 0; right: 0; }
  .grad-top { top: 0; height: 80px; background: linear-gradient(rgba(0,0,0,.75), transparent); }
  .grad-bot { bottom: 0; height: 130px; background: linear-gradient(transparent, rgba(0,0,0,.85)); }

  #title { position: absolute; top: 14px; left: 18px; right: 18px; font-size: 16px; font-weight: 500;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000; }

  #center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; align-items: center; gap: 44px; }
  button { font-family: inherit; }
  .btn { pointer-events: auto; background: rgba(0,0,0,.45); border: 0; color: #fff;
         border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .btn svg { fill: #fff; }
  .btn:active { background: rgba(255,255,255,.2); }
  .btn.sm { width: 54px; height: 54px; }
  .btn.sm svg { width: 32px; height: 32px; }
  .btn.lg { width: 72px; height: 72px; }
  .btn.lg svg { width: 42px; height: 42px; }

  #bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px 8px; }
  #barRow { display: flex; align-items: center; }
  #bar { flex: 1; position: relative; height: 30px; pointer-events: auto; touch-action: none; }
  #bar .track, #bar .buf, #bar .prog { position: absolute; left: 0; top: 13px; height: 4px; border-radius: 2px; }
  #bar .track { right: 0; background: rgba(255,255,255,.25); }
  #bar .buf { background: rgba(255,255,255,.45); width: 0; }
  #bar .prog { background: #e53935; width: 0; }
  #bar .knob { position: absolute; top: 8px; width: 14px; height: 14px; margin-left: -7px;
               border-radius: 50%; background: #e53935; left: 0; transition: transform .1s; }
  #bar.drag .knob { transform: scale(1.4); }

  #ctrlRow { display: flex; align-items: center; gap: 8px; height: 40px; }
  #time { font-size: 13px; font-variant-numeric: tabular-nums; flex: 1; text-shadow: 0 1px 2px #000; }
  .chip { pointer-events: auto; height: 34px; padding: 0 12px; border-radius: 17px; border: 0;
          background: rgba(255,255,255,.16); color: #fff; font-size: 13px; font-weight: 600;
          display: flex; align-items: center; gap: 6px; }
  .chip svg { width: 18px; height: 18px; fill: #fff; }
  .chip:active { background: rgba(255,255,255,.3); }
  .chip.icon { width: 40px; padding: 0; justify-content: center; background: transparent; }
  .chip.icon svg { width: 26px; height: 26px; }

  /* ---------- Settings sheet ---------- */
  #sheetBg { z-index: 40; background: rgba(0,0,0,.55); display: none; }
  #sheetBg.show { display: block; }
  #sheet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
           width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; background: #1c1c1e;
           border-radius: 16px 16px 0 0; padding: 14px 18px 18px; }
  #sheet h4 { font-size: 13px; font-weight: 600; color: #aaa; text-transform: uppercase;
              letter-spacing: .6px; margin: 8px 0 10px; display: flex; justify-content: space-between; }
  #sheet h4 span { color: #fff; text-transform: none; letter-spacing: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .opt { min-width: 64px; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #3a3a3c;
         background: #2c2c2e; color: #fff; font-size: 14px; font-weight: 500; }
  .opt.sel { background: #e53935; border-color: #e53935; font-weight: 700; }
  .handle { width: 40px; height: 4px; border-radius: 2px; background: #555; margin: 0 auto 6px; }
  #qNote { font-size: 11px; color: #888; margin-top: 2px; }

  /* ---------- Gestures feedback ---------- */
  .ripple { position: absolute; top: 0; bottom: 0; width: 38%; z-index: 15;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            background: rgba(255,255,255,.12); opacity: 0; transition: opacity .25s;
            pointer-events: none; font-size: 14px; font-weight: 600; }
  .ripple svg { width: 34px; height: 34px; fill: #fff; margin-bottom: 4px; }
  .ripple.show { opacity: 1; }
  #rip-l { left: 0; border-radius: 0 50% 50% 0 / 0 50% 50% 0; }
  #rip-r { right: 0; border-radius: 50% 0 0 50% / 50% 0 0 50%; }

  #toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); z-index: 45;
           background: rgba(0,0,0,.75); padding: 8px 16px; border-radius: 18px; font-size: 14px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }

  #spinner { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; z-index: 25;
             margin: -23px 0 0 -23px; border: 4px solid rgba(255,255,255,.25);
             border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
             pointer-events: none; }
  #spinner.hidden, #loading.hidden { display: none; }
  #loading { position: absolute; top: 50%; left: 0; right: 0; margin-top: 36px; z-index: 25;
             text-align: center; font-size: 14px; color: #bbb; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #msg { z-index: 50; display: none; background: #000; flex-direction: column; align-items: center;
         justify-content: center; gap: 16px; text-align: center; padding: 24px; font-size: 15px; }
  #msg.show { display: flex; }
  html.native, body.native { background: transparent; }
  body.native #stage, body.native #cover { display: none; }
  #retry { background: #e53935; }
</style>
</head>
<body oncontextmenu="return false">
  <div id="stage" class="fill"><div id="yt-box"><div id="yt"></div></div></div>
  <div id="cover" class="fill"></div>
  <div id="shield" class="fill"></div>

  <div id="rip-l" class="ripple">
    <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg><span></span>
  </div>
  <div id="rip-r" class="ripple">
    <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg><span></span>
  </div>

  <div id="ui" class="fill">
    <div class="grad-top"></div>
    <div class="grad-bot"></div>
    <div id="title"></div>

    <div id="center">
      <button class="btn sm" id="back10" aria-label="Back 10s">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16" font-size="6.5" text-anchor="middle" fill="#fff" font-weight="700">10</text></svg>
      </button>
      <button class="btn lg" id="play" aria-label="Play/Pause">
        <svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn sm" id="fwd10" aria-label="Forward 10s">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="16" font-size="6.5" text-anchor="middle" fill="#fff" font-weight="700">10</text></svg>
      </button>
    </div>

    <div id="bottom">
      <div id="barRow">
        <div id="bar"><div class="track"></div><div class="buf"></div><div class="prog"></div><div class="knob"></div></div>
      </div>
      <div id="ctrlRow">
        <span id="time">0:00 / 0:00</span>
        <button class="chip" id="speedChip" aria-label="Playback speed">
          <svg viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>
          <span id="speedVal">1x</span>
        </button>
        <button class="chip" id="qualChip" aria-label="Quality">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.39.3.61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54a7.3 7.3 0 0 0 1.62-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
          <span id="qualVal">Auto</span>
        </button>
        <button class="chip icon" id="fs" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path id="fsIcon" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="sheetBg" class="fill">
    <div id="sheet">
      <div class="handle"></div>
      <h4>Playback speed <span id="speedNow">1x</span></h4>
      <div class="opts" id="speedOpts"></div>
      <h4>Quality <span id="qualNow">Auto</span></h4>
      <div class="opts" id="qualOpts"></div>
      <div id="qNote"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="spinner"></div>
  <div id="loading">Loading lecture...</div>
  <div id="msg" class="fill"><div id="msgText"></div><button class="chip" id="retry">Retry</button></div>

<script>
(function () {
  'use strict';
  var VIDEO_ID = '{{VIDEO_ID}}';
  var START_AT = Number('{{START_AT}}') || 0;
  var TITLE = decodeURIComponent('{{TITLE}}');
  var MODE = '{{MODE}}';           // 'native' = our stream player, 'embed' = YouTube iframe fallback
  var SEEK_STEP = 10;
  var SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  var Q_NAMES = { hd2160: '2160p', hd1440: '1440p', hd1080: '1080p', hd720: '720p', large: '480p',
                  medium: '360p', small: '240p', tiny: '144p' };

  var Native = window.Android || {
    onProgress: function () {}, reload: function () { location.reload(); },
    toggleFullscreen: function () {}, cmd: function () {}
  };

  var $ = function (id) { return document.getElementById(id); };
  var ui = $('ui'), cover = $('cover'), spinner = $('spinner'), box = $('yt-box');
  var bar = $('bar'), prog = bar.querySelector('.prog'), buf = bar.querySelector('.buf'),
      knob = bar.querySelector('.knob');
  $('title').textContent = TITLE;

  var E = null;                    // active engine
  var ready = false, playing = false, ended = false, dragging = false, lastState = '';
  var hideTimer = 0, tickTimer = 0, lastSaved = 0, speed = 1;

  // ---------- Hard-block anything that could leak the video link ----------
  ['contextmenu', 'selectstart', 'dragstart', 'copy', 'cut'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }, true);
  });
  window.open = function () { return null; };

  // =====================================================================
  //  Engine 1: native stream player (ExoPlayer in the app, under this page)
  // =====================================================================
  var ns = { t: 0, d: 0, buf: 0, seekUntil: 0, seekT: 0 };
  var NativeEngine = {
    name: 'native',
    play: function () { Native.cmd('play', ''); },
    pause: function () { Native.cmd('pause', ''); },
    seek: function (t) { ns.t = t; ns.seekT = t; ns.seekUntil = Date.now() + 700; Native.cmd('seek', String(t)); },
    setRate: function (r) { Native.cmd('rate', String(r)); },
    setQuality: function (id) { Native.cmd('quality', id); },
    time: function () { return ns.t; },
    duration: function () { return ns.d; },
    loaded: function () { return ns.buf; }
  };

  // Called by the app ~4x per second and on every change.
  window.nativeState = function (s) {
    if (!ready) {
      ready = true;
      $('loading').classList.add('hidden');
      $('msg').classList.remove('show');
      tick();
      showUi(true);
    }
    // Ignore positions from before a seek we just made (they arrive slightly late).
    if (Date.now() > ns.seekUntil || Math.abs(s.t - ns.seekT) < 1.5) ns.t = s.t;
    ns.d = s.d; ns.buf = s.buf;
    if (s.state !== 'buffering') $('loading').classList.add('hidden'); // clear "Reconnecting..." etc.
    if (s.qualities) setQualityOptions(s.qualities, s.quality, s.label, s.engine);
    setPlayState(s.state);
  };
  window.nativeStatus = function (text) {
    $('msg').classList.remove('show');
    spinner.classList.remove('hidden');
    var l = $('loading');
    l.textContent = text;
    l.classList.remove('hidden');
  };
  window.nativeError = function (text) { showError(text); };

  // =====================================================================
  //  Engine 2: YouTube iframe (only used if streaming fails)
  // =====================================================================
  var yt = null;
  var EmbedEngine = {
    name: 'embed',
    play: function () { yt.playVideo(); },
    pause: function () { yt.pauseVideo(); },
    seek: function (t) { yt.seekTo(t, true); },
    setRate: function (r) { yt.setPlaybackRate(r); },
    setQuality: function () {},
    time: function () { return yt.getCurrentTime() || 0; },
    duration: function () { return yt.getDuration() || 0; },
    loaded: function () { return yt.getVideoLoadedFraction() || 0; }
  };

  // YouTube draws its logo / title / badges at the edges of the iframe: make the iframe larger
  // than the screen on the letterbox side so those edges fall off-screen.
  var CROP = 0.22, MIN_CROP = 90;
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    var bw = W, bh = H, x = 0, y = 0;
    if (W / H > 16 / 9) { var px = Math.max(MIN_CROP, W * CROP); bw = W + 2 * px; x = -px; }
    else { var py = Math.max(MIN_CROP, H * CROP); bh = H + 2 * py; y = -py; }
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = bw + 'px'; box.style.height = bh + 'px';
  }

  var watchdog = 0;
  function startEmbed(startAt) {
    MODE = 'embed';
    E = EmbedEngine;
    ready = false;
    document.body.classList.remove('native');
    document.documentElement.classList.remove('native');
    layout();
    window.addEventListener('resize', layout);
    window.nativeStatus('Loading lecture...');
    setQualityOptions([], '', '', 'embed');
    watchdog = setTimeout(function () {
      if (!ready) showError('Video is taking too long to load. Check your internet and retry.');
    }, 20000);
    window.onYouTubeIframeAPIReady = function () {
      yt = new YT.Player('yt', {
        videoId: VIDEO_ID, width: '100%', height: '100%',
        playerVars: {
          autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1,
          iv_load_policy: 3, modestbranding: 1, cc_load_policy: 0, enablejsapi: 1,
          start: Math.floor(startAt || START_AT), origin: location.origin
        },
        events: { onReady: onYtReady, onStateChange: onYtState, onError: onYtError,
                  onPlaybackQualityChange: updateEmbedQuality, onApiChange: captionsOff }
      });
    };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () { showError('No internet connection.'); };
    document.head.appendChild(tag);
  }
  window.startEmbed = startEmbed;

  function onYtReady() {
    ready = true;
    clearTimeout(watchdog);
    $('loading').classList.add('hidden');
    yt.getIframe().setAttribute('tabindex', '-1');
    captionsOff();
    yt.playVideo();
    tick();
    showUi(true);
    setTimeout(function () {
      var st = yt.getPlayerState ? yt.getPlayerState() : -1;
      if (st === -1 || st === 5) { cover.className = 'fill paused'; spinner.classList.add('hidden'); }
    }, 3000);
  }
  function onYtState(e) {
    var S = YT.PlayerState;
    var map = {}; map[S.PLAYING] = 'playing'; map[S.PAUSED] = 'paused'; map[S.ENDED] = 'ended';
    map[S.BUFFERING] = 'buffering'; map[S.CUED] = 'paused'; map[S.UNSTARTED] = 'buffering';
    var st = map[e.data] || 'paused';
    cover.className = st === 'playing' ? 'fill hidden' : st === 'ended' ? 'fill' : 'fill paused';
    if (st === 'playing') { captionsOff(); updateEmbedQuality(); }
    setPlayState(st);
  }
  function onYtError(e) {
    var m = { 2: 'Invalid video.', 5: 'This video can\'t be played here.', 100: 'Video not found or removed.',
              101: 'Embedding is disabled for this video.', 150: 'Embedding is disabled for this video.',
              152: 'Player configuration error.', 153: 'Player configuration error.' };
    showError(m[e.data] || 'Playback error (' + e.data + ').');
  }
  function captionsOff() {
    if (!yt) return;
    try { yt.unloadModule('captions'); } catch (e) {}
    try { yt.unloadModule('cc'); } catch (e) {}
    try { yt.setOption('captions', 'track', {}); } catch (e) {}
  }
  function updateEmbedQuality() {
    var q = yt && yt.getPlaybackQuality ? Q_NAMES[yt.getPlaybackQuality()] : '';
    $('qualVal').textContent = q || 'Auto';
    $('qualNow').textContent = q ? 'Auto (' + q + ')' : 'Auto';
  }

  // =====================================================================
  //  Shared player UI
  // =====================================================================
  function setPlayState(st) {
    if (st === lastState) return;
    lastState = st;
    playing = st === 'playing';
    ended = st === 'ended';
    spinner.classList.toggle('hidden', st !== 'buffering');
    if (playing) $('msg').classList.remove('show');
    $('playIcon').setAttribute('d', playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'
      : ended ? 'M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z'
      : 'M8 5v14l11-7z');
    if (st === 'paused' || st === 'ended') save(true);
    if (playing) scheduleHide(); else showUi(true);
  }

  function showError(t) {
    spinner.classList.add('hidden');
    $('loading').classList.add('hidden');
    $('msgText').textContent = t;
    $('msg').classList.add('show');
  }
  $('retry').addEventListener('click', function () {
    $('msg').classList.remove('show');
    try { Native.reload(); } catch (e) { location.reload(); }
  });

  function dur() { return ready ? E.duration() : 0; }
  function cur() { return ready ? E.time() : 0; }

  function togglePlay() {
    if (!ready) return;
    if (ended) { E.seek(0); E.play(); }
    else if (playing) E.pause(); else E.play();
  }

  function seekBy(sec) {
    if (!ready) return;
    var d = dur(), t = Math.max(0, Math.min(cur() + sec, d ? d - 0.5 : cur() + sec));
    E.seek(t);
    render(t);
  }

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }

  function render(t) {
    var d = dur(), p = d ? Math.min(1, t / d) : 0;
    prog.style.width = (p * 100) + '%';
    knob.style.left = (p * 100) + '%';
    $('time').textContent = fmt(t) + ' / ' + fmt(d);
  }

  function tick() {
    clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      if (!ready) return;
      if (!dragging) render(cur());
      buf.style.width = (E.loaded() * 100) + '%';
      save(false);
    }, 250);
  }

  // Native mode saves progress in the app itself; this is for the iframe fallback.
  function save(force) {
    var now = Date.now();
    if (!ready || MODE !== 'embed' || (!force && now - lastSaved < 5000)) return;
    lastSaved = now;
    try { Native.onProgress(cur(), dur()); } catch (e) {}
  }

  var toastTimer = 0;
  function toast(t) {
    var el = $('toast');
    el.textContent = t;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1200);
  }

  // ---------- Speed & quality ----------
  function setSpeed(s) {
    speed = s;
    if (ready) E.setRate(s);
    $('speedVal').textContent = $('speedNow').textContent = s + 'x';
    markSel('speedOpts', String(s));
  }

  function markSel(id, val) {
    [].forEach.call($(id).children, function (c) { c.classList.toggle('sel', c.getAttribute('data-v') === val); });
  }

  function buildOpts(id, items, onPick) {
    $(id).innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'opt';
      b.textContent = it.label;
      b.setAttribute('data-v', it.value);
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        onPick(it);
        closeSheet();
      });
      $(id).appendChild(b);
    });
  }
  buildOpts('speedOpts', SPEEDS.map(function (s) { return { label: s === 1 ? 'Normal' : s + 'x', value: String(s) }; }),
    function (it) { setSpeed(Number(it.value)); toast('Speed ' + it.value + 'x'); });
  markSel('speedOpts', '1');

  // qualities: [{id, label}], selected: id, label: what is actually playing (e.g. "720p")
  var qualKey = '';
  function setQualityOptions(qualities, selected, label, engine) {
    var key = JSON.stringify(qualities) + selected;
    if (key !== qualKey) {
      qualKey = key;
      buildOpts('qualOpts', qualities.map(function (q) { return { label: q.label, value: q.id }; }),
        function (it) { E.setQuality(it.value); toast('Quality ' + it.label); });
      markSel('qualOpts', selected);
      $('qNote').textContent = engine === 'embed'
        ? 'Compatibility mode: quality is chosen automatically by YouTube.'
        : 'Auto adjusts to your internet speed.';
    }
    if (engine === 'embed') return;
    var auto = selected === 'auto';
    $('qualVal').textContent = label || 'Auto';
    $('qualNow').textContent = auto ? (label ? 'Auto (' + label + ')' : 'Auto') : (label || '');
  }

  var sheetBg = $('sheetBg');
  function openSheet() { clearTimeout(hideTimer); sheetBg.classList.add('show'); }
  function closeSheet() { sheetBg.classList.remove('show'); scheduleHide(); }
  sheetBg.addEventListener('click', function (e) { if (e.target === sheetBg) closeSheet(); });
  $('sheet').addEventListener('click', function (e) { e.stopPropagation(); });

  // ---------- Controls visibility ----------
  function showUi(stay) {
    ui.classList.remove('off');
    if (!stay) scheduleHide();
  }
  function hideUi() {
    if (!playing || dragging || sheetBg.classList.contains('show')) return;
    ui.classList.add('off');
  }
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideUi, 3000);
  }

  function on(id, fn) {
    $(id).addEventListener('click', function (e) { e.stopPropagation(); fn(); scheduleHide(); });
  }
  on('play', togglePlay);
  on('back10', function () { seekBy(-SEEK_STEP); flash('l', SEEK_STEP); });
  on('fwd10', function () { seekBy(SEEK_STEP); flash('r', SEEK_STEP); });
  on('fs', function () { try { Native.toggleFullscreen(); } catch (e) {} });
  on('speedChip', openSheet);
  on('qualChip', openSheet);

  window.setFullscreenIcon = function (fs) {
    $('fsIcon').setAttribute('d', fs
      ? 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z'
      : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z');
    if (MODE === 'embed') setTimeout(layout, 50);
  };
  window.pauseVideo = function () { if (ready && E) E.pause(); };

  // ---------- Seek bar (drag) ----------
  function barPos(e) {
    var r = bar.getBoundingClientRect(), x = (e.touches ? e.touches[0] : e).clientX;
    return Math.max(0, Math.min(1, (x - r.left) / r.width));
  }
  function barMove(e) {
    e.preventDefault();
    render(barPos(e) * dur());
  }
  function barStart(e) {
    if (!ready) return;
    e.stopPropagation();
    dragging = true;
    bar.classList.add('drag');
    clearTimeout(hideTimer);
    barMove(e);
  }
  function barEnd() {
    if (!dragging) return;
    dragging = false;
    bar.classList.remove('drag');
    E.seek(parseFloat(prog.style.width) / 100 * dur());
    scheduleHide();
  }
  bar.addEventListener('touchstart', barStart, { passive: false });
  bar.addEventListener('touchmove', function (e) { if (dragging) barMove(e); }, { passive: false });
  bar.addEventListener('touchend', barEnd);
  bar.addEventListener('mousedown', barStart);
  document.addEventListener('mousemove', function (e) { if (dragging) barMove(e); });
  document.addEventListener('mouseup', barEnd);

  // ---------- Tap / double-tap gestures on the shield ----------
  var lastTap = 0, tapTimer = 0, seekCombo = 0, comboSide = '', comboTimer = 0;
  var rip = { l: $('rip-l'), r: $('rip-r') };

  function flash(side, total) {
    var el = rip[side];
    el.querySelector('span').textContent = total + ' seconds';
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 600);
  }

  function comboStep(side, now) {
    lastTap = now;
    seekBy(side === 'l' ? -SEEK_STEP : SEEK_STEP);
    flash(side, seekCombo);
    clearTimeout(comboTimer);
    comboTimer = setTimeout(function () { seekCombo = 0; }, 700);
  }

  function handleTap(x, w) {
    var now = Date.now();
    var side = x < w * 0.35 ? 'l' : x > w * 0.65 ? 'r' : 'c';

    // Already in a seek combo: every extra tap on the same side adds another step.
    if (seekCombo && side === comboSide && now - lastTap < 700) {
      seekCombo += SEEK_STEP;
      comboStep(side, now);
      return;
    }

    if (now - lastTap < 300) {            // double tap
      clearTimeout(tapTimer);
      lastTap = 0;
      if (side === 'c') { togglePlay(); return; }
      seekCombo = SEEK_STEP; comboSide = side;
      comboStep(side, now);
      return;
    }

    lastTap = now;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function () {    // single tap: toggle controls
      if (ui.classList.contains('off')) showUi(!playing); else hideUi();
    }, 300);
  }

  var shield = $('shield');
  shield.addEventListener('touchend', function (e) {
    e.preventDefault();
    handleTap(e.changedTouches[0].clientX, window.innerWidth);
  }, { passive: false });
  shield.addEventListener('click', function (e) { handleTap(e.clientX, window.innerWidth); });

  // ---------- Start ----------
  if (MODE === 'embed') {
    startEmbed(START_AT);
  } else {
    E = NativeEngine;
    document.body.classList.add('native');
    document.documentElement.classList.add('native');
    window.nativeStatus('Loading lecture...');
  }
})();
</script>
</body>
